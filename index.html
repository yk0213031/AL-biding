<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 Annual Leave Wish Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f3f4f6; }
        .cal-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
        .day-cell {
            min-height: 70px; padding: 4px; font-size: 11px;
            border: 1px solid #e5e7eb; background: white;
            position: relative; cursor: pointer; transition: all 0.15s;
        }
        .day-cell:hover:not(.weekend):not(.winner) { background: #f9fafb; }
        .day-cell.weekend { background: #f9fafb; color: #d1d5db; cursor: default; }
        .day-cell.winner { background: #dcfce7 !important; border-color: #22c55e !important; }
        .day-cell.selected-c1 { background: #dbeafe !important; border-color: #3b82f6 !important; }
        .day-cell.selected-c2 { background: #f3e8ff !important; border-color: #a855f7 !important; }
        .day-cell.selected-c3 { background: #ffedd5 !important; border-color: #f97316 !important; }
        .day-cell.conflict { box-shadow: inset 0 0 0 2px #ef4444; }
        .tag { display: inline-block; padding: 1px 4px; border-radius: 3px; font-size: 9px; font-weight: bold; margin-top: 2px; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tag-winner { background: #22c55e; color: white; }
        .tag-c1 { background: #3b82f6; color: white; }
        .tag-c2 { background: #a855f7; color: white; }
        .tag-c3 { background: #f97316; color: white; }
        .month-card { break-inside: avoid; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const YEAR = 2027;
        const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        const WEEKDAYS = ["Mon","Tue","Wed","Thu","Fri"];
        const STORAGE_KEY = "leave_2027_v5";
        const ADMIN_PASS = "7851";

        const getDaysInMonth = (mi) => new Date(YEAR, mi + 1, 0).getDate();
        const getDayOfWeek = (d, mi) => { const day = new Date(YEAR, mi, d).getDay(); return day === 0 ? 6 : day - 1; };
        const isWeekend = (d, mi) => getDayOfWeek(d, mi) >= 5;
        const fmtDate = (d, mi) => `${YEAR}-${String(mi+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

        // --- Horizontal Month Calendar Component ---
        const MonthCal = ({ monthIndex, apps, winners, mode, currentUser, onToggle }) => {
            const daysInMonth = getDaysInMonth(monthIndex);
            const cells = [];

            for (let d = 1; d <= daysInMonth; d++) {
                if (isWeekend(d, monthIndex)) continue;

                const dateStr = fmtDate(d, monthIndex);
                const isWinner = winners.some(w => w.date === dateStr);
                const winnerName = isWinner ? winners.find(w => w.date === dateStr)?.name : null;

                const selections = [];
                apps.forEach(app => {
                    if (app.c1.includes(dateStr)) selections.push({ name: app.name, type: 'C1' });
                    else if (app.c2.includes(dateStr)) selections.push({ name: app.name, type: 'C2' });
                    else if (app.c3.includes(dateStr)) selections.push({ name: app.name, type: 'C3' });
                });

                const mySel = currentUser ? selections.find(s => s.name.toLowerCase() === currentUser.toLowerCase()) : null;
                const others = selections.filter(s => !currentUser || s.name.toLowerCase() !== currentUser.toLowerCase());
                const hasConflict = mode === 'apply' && others.length > 0 && !isWinner;

                let cellClass = "day-cell";
                if (isWinner) cellClass += " winner";
                else if (mySel?.type === 'C1') cellClass += " selected-c1";
                else if (mySel?.type === 'C2') cellClass += " selected-c2";
                else if (mySel?.type === 'C3') cellClass += " selected-c3";
                if (hasConflict) cellClass += " conflict";

                cells.push(
                    <div key={d}
                         className={cellClass}
                         onClick={() => mode === 'apply' && !isWinner && onToggle(dateStr)}>
                        <div className="font-bold text-gray-700">{d}</div>

                        {isWinner && <div className="tag tag-winner">✓ {winnerName}</div>}

                        {!isWinner && mode === 'view' && selections.slice(0, 3).map((s, i) => (
                            <div key={i} className={`tag tag-${s.type.toLowerCase()}`} title={`${s.name} (${s.type})`}>
                                {s.name.split(' ')[0]}
                            </div>
                        ))}
                        {!isWinner && mode === 'view' && selections.length > 3 && (
                            <div className="text-[9px] text-gray-500 mt-1">+{selections.length - 3} more</div>
                        )}

                        {mode === 'apply' && mySel && !isWinner && (
                            <div className={`tag tag-${mySel.type.toLowerCase()}`}>You ({mySel.type})</div>
                        )}
                        {hasConflict && (
                            <div className="text-[9px] text-red-600 font-bold mt-1 truncate" title={others.map(o=>o.name).join(", ")}>
                                ⚠ {others.length} other{others.length > 1 ? 's' : ''}
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="month-card bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                    <h3 className="text-base font-bold text-gray-800 mb-2 pb-2 border-b">{MONTHS[monthIndex]}</h3>
                    <div className="cal-grid mb-1">
                        {WEEKDAYS.map(w => <div key={w} className="text-[10px] font-bold text-center text-gray-500 py-1">{w}</div>)}
                    </div>
                    <div className="cal-grid">{cells}</div>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState("summary");
            const [data, setData] = useState({ applications: [], winners: [] });
            const [adminAuth, setAdminAuth] = useState(false);
            const [adminPass, setAdminPass] = useState("");

            useEffect(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) setData(JSON.parse(saved));
                } catch(e) { console.error("Load error", e); }
            }, []);

            const save = (newData) => {
                setData(newData);
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(newData)); }
                catch(e) { alert("Storage full! Clear some data."); }
            };

            const [appName, setAppName] = useState("");
            const [choices, setChoices] = useState({ c1: [], c2: [], c3: [] });
            const [activeChoice, setActiveChoice] = useState("c1");
            const [alertMsg, setAlertMsg] = useState("");

            const handleToggle = (dateStr) => {
                if (!appName.trim()) { alert("Enter your name first!"); return; }

                const cur = [...choices[activeChoice]];
                const idx = cur.indexOf(dateStr);
                const total = choices.c1.length + choices.c2.length + choices.c3.length;

                if (idx === -1) {
                    if (total >= 5) { alert("Max 5 days total across all choices."); return; }
                    const nc = { ...choices };
                    ['c1','c2','c3'].forEach(k => { nc[k] = nc[k].filter(d => d !== dateStr); });
                    nc[activeChoice].push(dateStr);
                    nc[activeChoice].sort();
                    setChoices(nc);

                    const conflicts = data.applications.filter(a =>
                        a.name.toLowerCase() !== appName.trim().toLowerCase() &&
                        [a.c1, a.c2, a.c3].some(arr => arr.includes(dateStr))
                    );
                    if (conflicts.length > 0) {
                        setAlertMsg(`⚠ CONFLICT: ${conflicts.map(c => c.name).join(', ')} also selected ${dateStr}. Admin will decide.`);
                    } else {
                        setAlertMsg("");
                    }
                } else {
                    cur.splice(idx, 1);
                    setChoices({ ...choices, [activeChoice]: cur });
                    setAlertMsg("");
                }
            };

            const submitApp = () => {
                if (!appName.trim()) return alert("Name required");
                const total = choices.c1.length + choices.c2.length + choices.c3.length;
                if (total < 1 || total > 5) return alert("Select 1-5 days total");

                const newApp = {
                    id: Date.now(),
                    name: appName.trim(),
                    c1: choices.c1, c2: choices.c2, c3: choices.c3,
                    ts: new Date().toISOString()
                };

                const filtered = data.applications.filter(a => a.name.toLowerCase() !== appName.trim().toLowerCase());
                save({ ...data, applications: [...filtered, newApp] });
                alert("✅ Application submitted!");
                setChoices({ c1: [], c2: [], c3: [] });
                setAppName("");
                setAlertMsg("");
                setView("summary");
            };

            const [adminFilter, setAdminFilter] = useState("");

            const approveChoice = (app, choiceKey) => {
                const dates = app[choiceKey];
                if (!dates.length) return;
                const cleanWinners = data.winners.filter(w => !dates.includes(w.date));
                const newWinners = dates.map(d => ({ date: d, name: app.name, choice: choiceKey }));
                save({ ...data, winners: [...cleanWinners, ...newWinners] });
                alert(`✅ Approved ${app.name}'s ${choiceKey.toUpperCase()} (${dates.length} days)`);
            };

            const revokeWinner = (name, dates) => {
                const clean = data.winners.filter(w => !(w.name === name && dates.includes(w.date)));
                save({ ...data, winners: clean });
            };

            const filteredApps = useMemo(() => {
                if (!adminFilter) return data.applications;
                return data.applications.filter(a => a.name.toLowerCase().includes(adminFilter.toLowerCase()));
            }, [data.applications, adminFilter]);

            // ==================== SUMMARY VIEW ====================
            if (view === "summary") {
                return (
                    <div className="max-w-[1600px] mx-auto p-4 md:p-6">
                        <div className="flex flex-wrap justify-between items-center gap-4 mb-8 no-print">
                            <h1 className="text-2xl md:text-3xl font-bold text-gray-900">2027 Leave Wish Summary</h1>
                            <div className="flex gap-3">
                                <button onClick={() => setView("apply")} className="px-5 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold shadow-md">Apply for Leave</button>
                                <button onClick={() => { setAdminAuth(false); setView("admin"); }} className="px-5 py-2.5 bg-gray-800 text-white rounded-lg hover:bg-gray-900 font-semibold shadow-md">Admin Panel</button>
                            </div>
                        </div>

                        <div className="flex flex-wrap gap-3 mb-6 text-xs font-bold no-print">
                            <span className="px-3 py-1 bg-green-100 text-green-800 rounded-full">✓ Approved</span>
                            <span className="px-3 py-1 bg-blue-100 text-blue-800 rounded-full">1st Choice</span>
                            <span className="px-3 py-1 bg-purple-100 text-purple-800 rounded-full">2nd Choice</span>
                            <span className="px-3 py-1 bg-orange-100 text-orange-800 rounded-full">3rd Choice</span>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mb-10">
                            {MONTHS.map((_, i) => (
                                <MonthCal key={i} monthIndex={i} apps={data.applications} winners={data.winners} mode="view" />
                            ))}
                        </div>

                        <div className="bg-white rounded-xl shadow-lg overflow-hidden">
                            <div className="px-6 py-4 bg-gray-50 border-b">
                                <h2 className="text-xl font-bold text-gray-800">All Applications ({data.applications.length})</h2>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-gray-100 text-gray-600 uppercase text-xs">
                                        <tr>
                                            <th className="px-4 py-3">Applicant</th>
                                            <th className="px-4 py-3">1st Choice</th>
                                            <th className="px-4 py-3">2nd Choice</th>
                                            <th className="px-4 py-3">3rd Choice</th>
                                            <th className="px-4 py-3">Total</th>
                                            <th className="px-4 py-3">Final Result</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-200">
                                        {[...data.applications].sort((a,b) => a.name.localeCompare(b.name)).map(app => {
                                            const wonDates = data.winners.filter(w => w.name === app.name).map(w => w.date);
                                            const totalReq = app.c1.length + app.c2.length + app.c3.length;
                                            const status = wonDates.length > 0
                                                ? <span className="text-green-700 font-bold">✅ {wonDates.length}/{totalReq}</span>
                                                : <span className="text-gray-400">Pending</span>;
                                            return (
                                                <tr key={app.id} className="hover:bg-gray-50">
                                                    <td className="px-4 py-3 font-semibold text-gray-900 whitespace-nowrap">{app.name}</td>
                                                    <td className="px-4 py-3 text-blue-600 text-xs">{app.c1.length ? app.c1.join(', ') : <span className="text-gray-300">—</span>}</td>
                                                    <td className="px-4 py-3 text-purple-600 text-xs">{app.c2.length ? app.c2.join(', ') : <span className="text-gray-300">—</span>}</td>
                                                    <td className="px-4 py-3 text-orange-600 text-xs">{app.c3.length ? app.c3.join(', ') : <span className="text-gray-300">—</span>}</td>
                                                    <td className="px-4 py-3 font-mono text-gray-700">{totalReq}</td>
                                                    <td className="px-4 py-3">{status}</td>
                                                </tr>
                                            );
                                        })}
                                        {data.applications.length === 0 && (
                                            <tr><td colSpan="6" className="px-6 py-10 text-center text-gray-400">No applications yet</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            }

            // ==================== APPLY VIEW ====================
            if (view === "apply") {
                const totalDays = choices.c1.length + choices.c2.length + choices.c3.length;
                return (
                    <div className="max-w-[1600px] mx-auto p-4 md:p-6">
                        <button onClick={() => setView("summary")} className="mb-6 text-gray-600 hover:text-gray-900 font-medium no-print">← Back to Summary</button>

                        <div className="bg-white rounded-xl shadow-lg p-6 md:p-8 mb-6 sticky top-4 z-40 no-print border-2 border-blue-100">
                            <h1 className="text-2xl font-bold mb-5 text-gray-900">Leave Application</h1>

                            <div className="mb-5">
                                <label className="block text-sm font-bold text-gray-700 mb-2">Full Name *</label>
                                <input
                                    type="text"
                                    value={appName}
                                    onChange={(e) => setAppName(e.target.value)}
                                    placeholder="Type your full name here"
                                    className="w-full md:w-1/2 px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg"
                                />
                            </div>

                            <div className="flex flex-wrap gap-2 mb-4">
                                {[["c1","1st Choice","blue"],["c2","2nd Choice","purple"],["c3","3rd Choice","orange"]].map(([k,l,c]) => (
                                    <button
                                        key={k}
                                        onClick={() => setActiveChoice(k)}
                                        className={`px-5 py-2.5 rounded-lg font-bold text-sm transition-all ${
                                            activeChoice === k
                                            ? `bg-${c}-600 text-white shadow-md ring-2 ring-offset-2 ring-${c}-400`
                                            : `bg-${c}-50 text-${c}-700 hover:bg-${c}-100`
                                        }`}
                                    >
                                        {l} ({choices[k].length})
                                    </button>
                                ))}
                            </div>

                            <div className="text-sm text-gray-600 mb-3">
                                Selecting <strong>{activeChoice === 'c1' ? '1st' : activeChoice === 'c2' ? '2nd' : '3rd'} Choice</strong> •
                                Total: <strong>{totalDays}/5 days</strong> • Click weekday cells to toggle
                            </div>

                            {alertMsg && (
                                <div className="p-4 bg-red-50 border-l-4 border-red-500 text-red-800 rounded-r animate-pulse text-sm font-medium">
                                    {alertMsg}
                                </div>
                            )}
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mb-20">
                            {MONTHS.map((_, i) => (
                                <MonthCal key={i} monthIndex={i} apps={data.applications} winners={data.winners} mode="apply" currentUser={appName} onToggle={handleToggle} />
                            ))}
                        </div>

                        <div className="fixed bottom-6 right-6 z-50 no-print">
                            <button
                                onClick={submitApp}
                                disabled={totalDays === 0 || !appName.trim()}
                                className="px-8 py-4 bg-green-600 text-white rounded-full shadow-2xl hover:bg-green-700 disabled:opacity-40 disabled:cursor-not-allowed font-bold text-lg transition-transform hover:scale-105 active:scale-95"
                            >
                                Submit ({totalDays} days)
                            </button>
                        </div>
                    </div>
                );
            }

            // ==================== ADMIN VIEW ====================
            if (view === "admin") {
                if (!adminAuth) {
                    return (
                        <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
                            <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
                                <div className="text-4xl mb-4">🔒</div>
                                <h2 className="text-2xl font-bold mb-6 text-gray-900">Admin Access</h2>
                                <input
                                    type="password"
                                    value={adminPass}
                                    onChange={(e) => setAdminPass(e.target.value)}
                                    onKeyDown={(e) => e.key === "Enter" && (adminPass === ADMIN_PASS ? (setAdminAuth(true), setAdminPass("")) : alert("❌ Wrong password"))}
                                    placeholder="Enter password"
                                    className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg mb-4 text-center text-xl tracking-[0.3em]"
                                    autoFocus
                                />
                                <button
                                    onClick={() => adminPass === ADMIN_PASS ? (setAdminAuth(true), setAdminPass("")) : alert("❌ Wrong password")}
                                    className="w-full py-3 bg-gray-900 text-white rounded-lg font-bold hover:bg-gray-800 transition-colors"
                                >
                                    Unlock Dashboard
                                </button>
                                <button onClick={() => setView("summary")} className="mt-6 text-gray-500 hover:text-gray-700 text-sm">← Back to Summary</button>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="max-w-6xl mx-auto p-4 md:p-6">
                        <div className="flex flex-wrap justify-between items-center gap-4 mb-8">
                            <h1 className="text-3xl font-bold text-gray-900">Admin Dashboard</h1>
                            <div className="flex gap-3">
                                <button onClick={() => setView("summary")} className="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 font-medium">Summary</button>
                                <button onClick={() => { setAdminAuth(false); setAdminPass(""); }} className="px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 font-medium">Logout</button>
                            </div>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col sm:flex-row items-start sm:items-center gap-3">
                            <span className="font-bold text-gray-700 whitespace-nowrap">Filter:</span>
                            <input
                                type="text"
                                value={adminFilter}
                                onChange={(e) => setAdminFilter(e.target.value)}
                                placeholder="Search applicant name..."
                                className="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                autoFocus
                            />
                            <span className="text-sm text-gray-500 whitespace-nowrap">{filteredApps.length} / {data.applications.length}</span>
                        </div>

                        <div className="space-y-4">
                            {[...filteredApps].sort((a,b) => a.name.localeCompare(b.name)).map(app => {
                                const wonDates = data.winners.filter(w => w.name === app.name).map(w => w.date);
                                const totalReq = app.c1.length + app.c2.length + app.c3.length;
                                const isFinalized = wonDates.length > 0 && wonDates.length >= totalReq;

                                return (
                                    <div key={app.id} className={`bg-white rounded-xl shadow-sm border-l-4 p-5 transition-all ${isFinalized ? 'border-green-500 bg-green-50/30' : 'border-blue-500'}`}>
                                        <div className="flex flex-wrap justify-between items-start gap-3 mb-4">
                                            <div>
                                                <h3 className="text-xl font-bold text-gray-900">{app.name}</h3>
                                                <p className="text-xs text-gray-500">Applied: {new Date(app.ts).toLocaleString()}</p>
                                            </div>
                                            {isFinalized && <span className="px-3 py-1 bg-green-100 text-green-800 rounded-full text-xs font-bold">✓ FINALIZED</span>}
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                            {[["c1","1st Choice","blue"],["c2","2nd Choice","purple"],["c3","3rd Choice","orange"]].map(([key, label, color]) => {
                                                const dates = app[key];
                                                if (!dates.length) return null;
                                                const isApproved = dates.every(d => wonDates.includes(d)) && dates.length > 0;

                                                return (
                                                    <div key={key} className={`p-4 rounded-lg border bg-${color}-50/50 border-${color}-200`}>
                                                        <div className="flex justify-between items-center mb-2">
                                                            <span className={`font-bold text-${color}-700 text-sm`}>{label}</span>
                                                            <span className="text-xs text-gray-500">{dates.length}d</span>
                                                        </div>
                                                        <div className="text-xs text-gray-700 mb-3 break-words leading-relaxed">{dates.join(', ')}</div>

                                                        {!isApproved ? (
                                                            <button
                                                                onClick={() => approveChoice(app, key)}
                                                                className={`w-full py-2 bg-${color}-600 text-white rounded font-bold text-xs hover:bg-${color}-700 transition-colors`}
                                                            >
                                                                ✓ APPROVE THIS CHOICE
                                                            </button>
                                                        ) : (
                                                            <button
                                                                onClick={() => revokeWinner(app.name, dates)}
                                                                className="w-full py-2 bg-gray-200 text-gray-700 rounded font-bold text-xs hover:bg-red-100 hover:text-red-700 transition-colors"
                                                            >
                                                                ✕ REVOKE
                                                            </button>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}

                            {filteredApps.length === 0 && (
                                <div className="text-center py-16 text-gray-400 bg-white rounded-xl shadow-sm">
                                    {data.applications.length === 0 ? "No applications yet" : `No match for "${adminFilter}"`}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
