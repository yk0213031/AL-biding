<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2027 Annual Leave Wish Selection</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.15s; }
  .cal-cell:hover:not(.disabled) { background: #dbeafe; }
  .cal-cell.selected { background: #3b82f6; color: white; }
  .cal-cell.conflict { background: #fca5a5; color: #991b1b; }
  .cal-cell.weekend { color: #dc2626; }
  .cal-cell.disabled { opacity: 0.3; cursor: not-allowed; }
  .choice-card { border-left: 4px solid #3b82f6; }
  .fade-in { animation: fadeIn 0.3s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBvI2eL9FdVJkqPHcEJNo5gPjBuSo2bhPc",
  authDomain: "al-biding.firebaseapp.com",
  databaseURL: "https://al-biding-default-rtdb.firebaseio.com",
  projectId: "al-biding",
  storageBucket: "al-biding.firebasestorage.app",
  messagingSenderId: "251488619983",
  appId: "1:251488619983:web:c701f8ad4c5e5054d016ba",
  measurementId: "G-TXESVYQWTJ"
};

// Initialize Firebase (only once)
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();
const LEAVE_REF = db.ref('leave_applications');

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ADMIN_PASS = '7851';

function parseDateRange(str) {
  if (!str || typeof str !== 'string') return null;
  const match = str.match(/^(\d{1,2})([A-Za-z]{3})-(\d{1,2})([A-Za-z]{3})$/);
  if (!match) return null;
  const [, d1, m1, d2, m2] = match;
  const mi1 = MONTHS.findIndex(m => m.toLowerCase() === m1.toLowerCase());
  const mi2 = MONTHS.findIndex(m => m.toLowerCase() === m2.toLowerCase());
  if (mi1 === -1 || mi2 === -1) return null;
  const start = new Date(2027, mi1, parseInt(d1));
  const end = new Date(2027, mi2, parseInt(d2));
  if (isNaN(start.getTime()) || isNaN(end.getTime())) return null;
  return { start, end, days: Math.round((end - start) / 86400000) + 1 };
}

function formatDateRange(start, end) {
  const d1 = String(start.getDate()).padStart(2,'0');
  const m1 = MONTHS[start.getMonth()];
  const d2 = String(end.getDate()).padStart(2,'0');
  const m2 = MONTHS[end.getMonth()];
  return `${d1}${m1}-${d2}${m2}`;
}

function getDatesInRange(start, end) {
  const dates = [];
  const cur = new Date(start);
  while (cur <= end) {
    dates.push(new Date(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}

function hasWeekendViolation(start, end) {
  const days = Math.round((end - start) / 86400000) + 1;
  if (days < 5) return false;
  const cur = new Date(start);
  while (cur <= end) {
    const dow = cur.getDay();
    if (dow === 0 || dow === 6) return true;
    cur.setDate(cur.getDate() + 1);
  }
  return false;
}

function App() {
  const [view, setView] = useState('apply');
  const [name, setName] = useState('');
  const [choices, setChoices] = useState(Array(5).fill(''));
  const [allApps, setAllApps] = useState([]);
  const [adminPass, setAdminPass] = useState('');
  const [isAdmin, setIsAdmin] = useState(false);
  const [filterTitle, setFilterTitle] = useState('');
  const [loading, setLoading] = useState(true);

  // Load data from Firebase on mount
  useEffect(() => {
    const unsub = LEAVE_REF.on('value', snap => {
      const val = snap.val() || {};
      const list = Object.entries(val).map(([id, data]) => ({ id, ...data }));
      list.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
      setAllApps(list);
      setLoading(false);
    });
    return () => LEAVE_REF.off('value', unsub);
  }, []);

  const saveChoice = async (idx, val) => {
    const newChoices = [...choices];
    newChoices[idx] = val;
    setChoices(newChoices);
  };

  const submitApp = async () => {
    if (!name.trim()) return alert('Please enter your name');
    const validChoices = choices.filter(c => c.trim());
    if (validChoices.length === 0) return alert('Please select at least one choice');

    for (let i = 0; i < validChoices.length; i++) {
      const parsed = parseDateRange(validChoices[i]);
      if (!parsed) return alert(`Invalid format in choice ${i+1}. Use DDMMM-DDMMM like 04Sep-08Sep`);
      if (parsed.days > 5) return alert(`Choice ${i+1} exceeds 5 days`);
      if (hasWeekendViolation(parsed.start, parsed.end)) {
        return alert(`Choice ${i+1}: 5-day selections cannot include Sat/Sun`);
      }
    }

    const record = {
      name: name.trim(),
      choices: validChoices,
      timestamp: Date.now(),
      version: 'amendment',
      status: 'pending'
    };

    await LEAVE_REF.push(record);
    setChoices(Array(5).fill(''));
    alert('Application submitted successfully!');
  };

  const cancelChoice = (idx) => {
    const nc = [...choices];
    nc[idx] = '';
    setChoices(nc);
  };

  const adminLogin = () => {
    if (adminPass === ADMIN_PASS) setIsAdmin(true);
    else alert('Wrong password');
  };

  const clearAllData = async () => {
    if (confirm('Clear ALL application data? This cannot be undone.')) {
      await LEAVE_REF.remove();
    }
  };

  const approveApp = async (id) => {
    await LEAVE_REF.child(id).update({ status: 'approved' });
  };

  const revokeApp = async (id) => {
    await LEAVE_REF.child(id).update({ status: 'revoked' });
  };

  // Calendar picker component
  const MiniCalendar = ({ value, onChange }) => {
    const [open, setOpen] = useState(false);
    const [selStart, setSelStart] = useState(null);
    const ref = useRef(null);

    useEffect(() => {
      const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
      document.addEventListener('mousedown', handler);
      return () => document.removeEventListener('mousedown', handler);
    }, []);

    const handleDayClick = (date) => {
      if (!selStart) {
        setSelStart(date);
      } else {
        const s = selStart < date ? selStart : date;
        const e = selStart < date ? date : selStart;
        onChange(formatDateRange(s, e));
        setSelStart(null);
        setOpen(false);
      }
    };

    const renderMonth = (monthIndex) => {
      const first = new Date(2027, monthIndex, 1);
      const last = new Date(2027, monthIndex + 1, 0);
      const startDow = first.getDay();
      const cells = [];
      for (let i = 0; i < startDow; i++) cells.push(<div key={`e${i}`} />);
      for (let d = 1; d <= last.getDate(); d++) {
        const date = new Date(2027, monthIndex, d);
        const dow = date.getDay();
        const isWe = dow === 0 || dow === 6;
        const isSelected = selStart && date.toDateString() === selStart.toDateString();
        cells.push(
          <div
            key={d}
            onClick={() => handleDayClick(date)}
            className={`cal-cell ${isWe ? 'weekend' : ''} ${isSelected ? 'selected' : ''}`}
          >
            {d}
          </div>
        );
      }
      return (
        <div key={monthIndex} className="mb-4">
          <div className="font-bold text-center mb-1">{MONTHS[monthIndex]} 2027</div>
          <div className="cal-grid text-xs">
            {DAYS.map(d => <div key={d} className="text-center font-semibold text-gray-500 py-1">{d}</div>)}
            {cells}
          </div>
        </div>
      );
    };

    return (
      <div ref={ref} className="relative inline-block">
        <input
          type="text"
          value={value}
          onChange={(e) => onChange(e.target.value)}
          placeholder="DDMMM-DDMMM or tap 📅"
          className="border rounded px-3 py-2 w-48 text-sm focus:ring-2 focus:ring-blue-300 outline-none"
        />
        <button
          type="button"
          onClick={() => setOpen(!open)}
          className="absolute right-2 top-1/2 -translate-y-1/2 text-lg"
        >📅</button>
        {open && (
          <div className="absolute z-50 bg-white border rounded-lg shadow-xl p-3 mt-1 w-72 max-h-96 overflow-y-auto">
            {Array.from({length:12}, (_,i) => renderMonth(i))}
          </div>
        )}
      </div>
    );
  };

  // Conflict detection (display only, no blocking)
  const getConflicts = (currentChoices) => {
    const conflicts = [];
    const parsed = currentChoices.map((c,i) => ({ idx:i, ...parseDateRange(c) })).filter(p => p);
    for (let i = 0; i < parsed.length; i++) {
      for (let j = i+1; j < parsed.length; j++) {
        const a = parsed[i], b = parsed[j];
        if (a.start <= b.end && b.start <= a.end) {
          conflicts.push(`Choice ${a.idx+1} & ${b.idx+1} overlap`);
        }
      }
    }
    // Check against others' approved apps
    allApps.forEach(app => {
      if (app.status !== 'approved') return;
      app.choices?.forEach(ac => {
        const ap = parseDateRange(ac);
        if (!ap) return;
        parsed.forEach(cp => {
          if (cp.start <= ap.end && ap.start <= cp.end) {
            conflicts.push(`Your choice ${cp.idx+1} conflicts with ${app.name}'s ${ac}`);
          }
        });
      });
    });
    return conflicts;
  };

  const conflicts = getConflicts(choices);

  // Summary calendar with interactive detail panel
  const SummaryCalendar = () => {
    const [selectedDate, setSelectedDate] = useState(null);
    const approved = allApps.filter(a => a.status === 'approved');

    // Build a map: "YYYY-MM-DD" -> [names]
    const dateMap = {};
    approved.forEach(app => {
      app.choices?.forEach(c => {
        const p = parseDateRange(c);
        if (!p) return;
        getDatesInRange(p.start, p.end).forEach(d => {
          const key = d.toISOString().slice(0,10);
          if (!dateMap[key]) dateMap[key] = [];
          dateMap[key].push({ name: app.name, choice: c });
        });
      });
    });

    const getCount = (date) => {
      const key = date.toISOString().slice(0,10);
      return dateMap[key]?.length || 0;
    };

    const getNames = (date) => {
      const key = date.toISOString().slice(0,10);
      return dateMap[key] || [];
    };

    const selectedNames = selectedDate ? getNames(selectedDate) : [];

    return (
      <div className="flex flex-col lg:flex-row gap-6">
        {/* Calendar side */}
        <div className="flex-1 space-y-6">
          {Array.from({length:12}, (_,monthIndex) => {
            const first = new Date(2027, monthIndex, 1);
            const last = new Date(2027, monthIndex+1, 0);
            const startDow = first.getDay();
            const cells = [];
            for (let i = 0; i < startDow; i++) cells.push(<div key={`e${i}`} />);
            for (let d = 1; d <= last.getDate(); d++) {
              const date = new Date(2027, monthIndex, d);
              const dow = date.getDay();
              const isWe = dow === 0 || dow === 6;
              const count = getCount(date);
              const isSelected = selectedDate && date.toDateString() === selectedDate.toDateString();
              // Heat color: white -> light blue -> dark blue based on count
              let bg = '';
              if (count > 0) {
                const intensity = Math.min(count / 15, 1);
                const r = Math.round(219 - intensity * 180);
                const g = Math.round(234 - intensity * 180);
                const b = 254;
                bg = `rgb(${r},${g},${b})`;
              }
              cells.push(
                <div
                  key={d}
                  onClick={() => setSelectedDate(date)}
                  className={`cal-cell flex-col cursor-pointer transition-colors ${isWe?'weekend':''} ${isSelected?'ring-2 ring-blue-600':''}`}
                  style={count > 0 ? { backgroundColor: bg } : {}}
                  title={`${count} applicant${count!==1?'s':''}`}
                >
                  <span className="font-medium">{d}</span>
                  {count > 0 && (
                    <span className="text-[10px] font-bold text-blue-800">{count}</span>
                  )}
                </div>
              );
            }
            return (
              <div key={monthIndex}>
                <h3 className="font-bold text-lg mb-2">{MONTHS[monthIndex]} 2027</h3>
                <div className="cal-grid text-xs border rounded-lg p-2 bg-white">
                  {DAYS.map(d => <div key={d} className="text-center font-semibold text-gray-500 py-1">{d}</div>)}
                  {cells}
                </div>
              </div>
            );
          })}
        </div>

        {/* Detail panel (sticky on desktop, below on mobile) */}
        <div className="lg:w-80 shrink-0">
          <div className="sticky top-4 bg-white rounded-xl shadow p-4 min-h-[200px]">
            {selectedDate ? (
              <>
                <h3 className="font-bold text-lg mb-1">
                  {selectedDate.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })}
                </h3>
                <p className="text-sm text-gray-500 mb-3">{selectedNames.length} applicant{selectedNames.length!==1?'s':''}</p>
                {selectedNames.length === 0 ? (
                  <p className="text-gray-400 italic">No applications on this date</p>
                ) : (
                  <ul className="space-y-1.5 max-h-[60vh] overflow-y-auto">
                    {selectedNames.map((item, i) => (
                      <li key={i} className="text-sm border-b pb-1 last:border-0">
                        <span className="font-medium text-blue-800">{item.name}</span>
                        <span className="text-gray-500 ml-1 text-xs">({item.choice})</span>
                      </li>
                    ))}
                  </ul>
                )}
              </>
            ) : (
              <div className="text-gray-400 text-center mt-12">
                👆 Click any date to see who applied
              </div>
            )}
          </div>
        </div>
      </div>
    );
  };

  if (loading) return <div className="flex items-center justify-center h-screen text-xl">Loading...</div>;

  return (
    <div className="min-h-screen p-4 max-w-5xl mx-auto">
      <header className="text-center mb-8">
        <h1 className="text-3xl font-bold text-blue-800">2027 Annual Leave Wish Selection</h1>
        <nav className="mt-4 flex justify-center gap-4">
          <button onClick={()=>setView('apply')} className={`px-4 py-2 rounded ${view==='apply'?'bg-blue-600 text-white':'bg-white'}`}>Apply</button>
          <button onClick={()=>setView('summary')} className={`px-4 py-2 rounded ${view==='summary'?'bg-blue-600 text-white':'bg-white'}`}>Summary</button>
          <button onClick={()=>setView('admin')} className={`px-4 py-2 rounded ${view==='admin'?'bg-blue-600 text-white':'bg-white'}`}>Admin</button>
        </nav>
      </header>

      {view === 'apply' && (
        <div className="fade-in max-w-2xl mx-auto">
          <div className="bg-white rounded-xl shadow p-6 space-y-4">
            <label className="block">
              <span className="font-semibold">Your Name</span>
              <input value={name} onChange={e=>setName(e.target.value)} className="w-full border rounded px-3 py-2 mt-1" placeholder="Enter full name" />
            </label>
            {[0,1,2,3,4].map(i => (
              <div key={i} className="choice-card bg-blue-50 p-4 rounded-r-lg">
                <div className="flex items-center justify-between mb-2">
                  <span className="font-semibold">Choice {i+1}</span>
                  {choices[i] && <button onClick={()=>cancelChoice(i)} className="text-red-500 text-sm hover:underline">Cancel</button>}
                </div>
                <MiniCalendar value={choices[i]} onChange={v=>saveChoice(i,v)} />
              </div>
            ))}
            {conflicts.length > 0 && (
              <div className="bg-yellow-50 border-l-4 border-yellow-400 p-3 text-sm text-yellow-800">
                {conflicts.map((c,i)=><div key={i}>⚠️ {c}</div>)}
              </div>
            )}
            <button onClick={submitApp} className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">Submit Application</button>
          </div>
        </div>
      )}

      {view === 'summary' && (
        <div className="fade-in">
          <h2 className="text-2xl font-bold mb-4 text-center">Leave Summary — All Applicants</h2>
          <SummaryCalendar />
        </div>
      )}

      {view === 'admin' && !isAdmin && (
        <div className="fade-in max-w-md mx-auto bg-white p-8 rounded-xl shadow text-center">
          <h2 className="text-xl font-bold mb-4">Admin Login</h2>
          <input type="password" value={adminPass} onChange={e=>setAdminPass(e.target.value)} className="border rounded px-4 py-2 w-full mb-4" placeholder="Password" />
          <button onClick={adminLogin} className="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Login</button>
        </div>
      )}

      {view === 'admin' && isAdmin && (
        <div className="fade-in space-y-6">
          <div className="flex flex-wrap gap-3 items-center justify-between bg-white p-4 rounded-lg shadow">
            <h2 className="text-xl font-bold">Admin Portal</h2>
            <div className="flex gap-2">
              <input value={filterTitle} onChange={e=>setFilterTitle(e.target.value)} placeholder="Filter by name..." className="border rounded px-3 py-1.5 text-sm" />
              <button onClick={clearAllData} className="bg-red-600 text-white px-4 py-1.5 rounded text-sm hover:bg-red-700">Clear All Data</button>
              <button onClick={()=>setIsAdmin(false)} className="text-gray-500 text-sm hover:underline">Logout</button>
            </div>
          </div>

          {/* Live summary preview */}
          <div className="bg-white p-4 rounded-lg shadow">
            <h3 className="font-bold mb-3">Live Summary Preview</h3>
            <SummaryCalendar />
          </div>

          {/* Application records */}
          <div className="bg-white rounded-lg shadow overflow-hidden">
            <table className="w-full text-sm">
              <thead className="bg-gray-100">
                <tr>
                  <th className="p-3 text-left">Name</th>
                  <th className="p-3 text-left">Choices</th>
                  <th className="p-3 text-left">Type</th>
                  <th className="p-3 text-left">Status</th>
                  <th className="p-3 text-left">Actions</th>
                </tr>
              </thead>
              <tbody>
                {allApps.filter(a => !filterTitle || a.name.toLowerCase().includes(filterTitle.toLowerCase())).map(app => (
                  <tr key={app.id} className="border-t hover:bg-gray-50">
                    <td className="p-3 font-medium">{app.name}</td>
                    <td className="p-3">{app.choices?.join(', ')}</td>
                    <td className="p-3"><span className={`text-xs px-2 py-0.5 rounded ${app.version==='amendment'?'bg-purple-100 text-purple-700':'bg-green-100 text-green-700'}`}>{app.version || 'first'}</span></td>
                    <td className="p-3"><span className={`text-xs px-2 py-0.5 rounded ${app.status==='approved'?'bg-green-100 text-green-700':app.status==='revoked'?'bg-red-100 text-red-700':'bg-yellow-100 text-yellow-700'}`}>{app.status}</span></td>
                    <td className="p-3 space-x-2">
                      {app.status !== 'approved' && <button onClick={()=>approveApp(app.id)} className="text-green-600 hover:underline text-xs">Approve</button>}
                      {app.status === 'approved' && <button onClick={()=>revokeApp(app.id)} className="text-red-600 hover:underline text-xs">Revoke</button>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
