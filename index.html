<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 Annual Leave Wish Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [currentView, setCurrentView] = useState('summary');
            const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
            const [adminPasswordInput, setAdminPasswordInput] = useState('');
            const [adminError, setAdminError] = useState(false);

            const [applications, setApplications] = useState(() => {
                const saved = localStorage.getItem('leave_applications_2027_v2');
                return saved ? JSON.parse(saved) : [];
            });

            useEffect(() => {
                localStorage.setItem('leave_applications_2027_v2', JSON.stringify(applications));
            }, [applications]);

            const handleAdminAccess = (e) => {
                e.preventDefault();
                if (adminPasswordInput === '7851') {
                    setIsAdminUnlocked(true);
                    setAdminError(false);
                    setCurrentView('admin');
                } else {
                    setAdminError(true);
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-indigo-600 text-white shadow-md">
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                <i data-lucide="calendar"></i> 2027 Annual Leave Planner
                            </h1>
                        </div>
                        <div className="max-w-7xl mx-auto px-4 flex gap-2 border-t border-indigo-500 pt-2 pb-2">
                            <button 
                                onClick={() => setCurrentView('summary')}
                                className={`px-4 py-2 rounded text-sm font-medium transition ${currentView === 'summary' ? 'bg-white text-indigo-600 shadow' : 'text-indigo-100 hover:bg-indigo-500'}`}
                            >
                                Summary Calendar
                            </button>
                            <button 
                                onClick={() => setCurrentView('apply')}
                                className={`px-4 py-2 rounded text-sm font-medium transition ${currentView === 'apply' ? 'bg-white text-indigo-600 shadow' : 'text-indigo-100 hover:bg-indigo-500'}`}
                            >
                                My Leave Application
                            </button>
                            <button 
                                onClick={() => {
                                    if (isAdminUnlocked) {
                                        setCurrentView('admin');
                                    } else {
                                        setCurrentView('admin-login');
                                    }
                                }}
                                className={`px-4 py-2 rounded text-sm font-medium transition ${(currentView === 'admin' || currentView === 'admin-login') ? 'bg-white text-indigo-600 shadow' : 'text-indigo-100 hover:bg-indigo-500'}`}
                            >
                                Admin Panel
                            </button>
                        </div>
                    </header>

                    <main className="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
                        {currentView === 'summary' && <SummaryView applications={applications} />}
                        {currentView === 'apply' && <ApplyView applications={applications} setApplications={setApplications} />}
                        {currentView === 'admin-login' && !isAdminUnlocked && (
                            <div className="max-w-md mx-auto bg-white p-6 rounded-xl shadow-sm border mt-10">
                                <h2 className="text-xl font-bold text-slate-800 mb-2">Admin Authentication Required</h2>
                                <p className="text-sm text-slate-600 mb-4">Please enter the administrator password to access the panel.</p>
                                <form onSubmit={handleAdminAccess} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Password</label>
                                        <input 
                                            type="password" 
                                            className="w-full border rounded p-2 text-sm"
                                            value={adminPasswordInput}
                                            onChange={(e) => setAdminPasswordInput(e.target.value)}
                                            placeholder="Enter admin password"
                                        />
                                    </div>
                                    {adminError && <p className="text-xs text-red-600">Incorrect password. Please try again.</p>}
                                    <button type="submit" className="w-full bg-indigo-600 text-white font-medium py-2 rounded-lg hover:bg-indigo-700 transition">
                                        Login to Admin Panel
                                    </button>
                                </form>
                            </div>
                        )}
                        {currentView === 'admin' && isAdminUnlocked && <AdminView applications={applications} setApplications={setApplications} />}
                    </main>

                    <footer className="bg-white border-t py-4 text-center text-xs text-slate-500">
                        2027 Annual Leave Selection Portal &copy; Internal Company Use
                    </footer>
                </div>
            );
        }

        function SummaryView({ applications }) {
            const months = [
                "January", "February", "March", "April", "May", "June", 
                "July", "August", "September", "October", "November", "December"
            ];
            const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

            const getSelectionsForDate = (dateStr) => {
                const results = [];
                applications.forEach(app => {
                    const applicantName = app.name || "Anonymous";
                    ['first', 'second', 'third'].forEach(choiceKey => {
                        const choice = app[choiceKey];
                        if (choice && choice.start && choice.end) {
                            if (dateStr >= choice.start && dateStr <= choice.end) {
                                results.push({ name: applicantName, rank: choiceKey });
                            }
                        }
                    });
                });
                return results;
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-xl shadow-sm border">
                        <h2 className="text-xl font-bold text-slate-800 mb-2">2027 Company Leave Summary</h2>
                        <p className="text-sm text-slate-600 mb-6">
                            Vertical month view showing workdays (Monday to Friday) and colleague choices: 
                            <span className="inline-block w-3 h-3 bg-indigo-600 rounded-full mx-1 align-middle"></span> 1st Choice | 
                            <span className="inline-block w-3 h-3 bg-blue-500 rounded-full mx-1 align-middle"></span> 2nd Choice | 
                            <span className="inline-block w-3 h-3 bg-teal-500 rounded-full mx-1 align-middle"></span> 3rd Choice
                        </p>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            {months.map((monthName, mIndex) => {
                                const monthNum = mIndex + 1;
                                const daysInMonth = new Date(2027, monthNum, 0).getDate();
                                
                                return (
                                    <div key={monthName} className="border rounded-lg p-4 bg-slate-50/50 flex flex-col">
                                        <h3 className="font-bold text-indigo-700 mb-3 border-b pb-2 text-center text-base">{monthName} 2027</h3>
                                        <div className="space-y-1.5 overflow-y-auto max-h-96 pr-1">
                                            {Array.from({ length: daysInMonth }, (_, dIndex) => {
                                                const dayNum = dIndex + 1;
                                                const formattedMonth = String(monthNum).padStart(2, '0');
                                                const formattedDay = String(dayNum).padStart(2, '0');
                                                const dateStr = `2027-${formattedMonth}-${formattedDay}`;
                                                
                                                const dateObj = new Date(dateStr);
                                                const dayOfWeekIndex = dateObj.getDay();
                                                const isWeekend = dayOfWeekIndex === 0 || dayOfWeekIndex === 6;
                                                if (isWeekend) return null;

                                                const dayOfWeekName = weekdays[dayOfWeekIndex];
                                                const activeSelections = getSelectionsForDate(dateStr);

                                                return (
                                                    <div key={dateStr} className="text-xs flex items-center justify-between bg-white px-2 py-1.5 rounded border border-slate-100 shadow-sm">
                                                        <span className="font-semibold text-slate-600 w-20 shrink-0">
                                                            {dayOfWeekName}, {dayNum}
                                                        </span>
                                                        <div className="flex flex-wrap gap-1 justify-end flex-grow min-w-0">
                                                            {activeSelections.length === 0 ? (
                                                                <span className="text-slate-300 italic">-</span>
                                                            ) : (
                                                                activeSelections.map((sel, idx) => {
                                                                    let colorBg = "bg-indigo-600 text-white";
                                                                    if (sel.rank === 'second') colorBg = "bg-blue-500 text-white";
                                                                    if (sel.rank === 'third') colorBg = "bg-teal-500 text-white";
                                                                    return (
                                                                        <span key={idx} className={`px-1.5 py-0.5 rounded text-[10px] font-medium truncate max-w-[120px] ${colorBg}`} title={`${sel.name} - ${sel.rank.toUpperCase()} choice`}>
                                                                            {sel.name} ({sel.rank[0].toUpperCase()})
                                                                        </span>
                                                                    );
                                                                })
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function ApplyView({ applications, setApplications }) {
            const [name, setName] = useState('');
            const [first, setFirst] = useState({ start: '', end: '' });
            const [second, setSecond] = useState({ start: '', end: '' });
            const [third, setThird] = useState({ start: '', end: '' });
            const [message, setMessage] = useState({ text: '', type: '' });

            const countWorkingDays = (startDate, endDate) => {
                if (!startDate || !endDate) return 0;
                let start = new Date(startDate);
                let end = new Date(endDate);
                if (start > end) return -1;

                let count = 0;
                let cur = new Date(start);
                while (cur <= end) {
                    const day = cur.getDay();
                    if (day !== 0 && day !== 6) count++;
                    cur.setDate(cur.getDate() + 1);
                }
                return count;
            };

            const validateChoice = (choice, label) => {
                if (!choice.start && !choice.end) return true;
                if (!choice.start || !choice.end) {
                    setMessage({ text: `${label} choice must have both start and end date.`, type: 'error' });
                    return false;
                }
                const days = countWorkingDays(choice.start, choice.end);
                if (days < 1 || days > 5) {
                    setMessage({ text: `${label} choice must be between 1 and 5 working days (Mon-Fri). Selected: ${days} days.`, type: 'error' });
                    return false;
                }
                return true;
            };

            const handleSave = (e) => {
                e.preventDefault();
                setMessage({ text: '', type: '' });

                if (!name.trim()) {
                    setMessage({ text: 'Please enter your applicant name first.', type: 'error' });
                    return;
                }

                if (!validateChoice(first, "1st")) return;
                if (!validateChoice(second, "2nd")) return;
                if (!validateChoice(third, "3rd")) return;

                const newApp = {
                    id: Date.now(),
                    name: name.trim(),
                    first,
                    second,
                    third,
                    finalAssigned: null,
                    updatedAt: new Date().toISOString()
                };

                const filtered = applications.filter(a => a.name.toLowerCase() !== name.trim().toLowerCase());
                setApplications([...filtered, newApp]);
                setMessage({ text: 'Leave wish choices successfully saved!', type: 'success' });
            };

            return (
                <div className="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-sm border">
                    <h2 className="text-xl font-bold text-slate-800 mb-1">Submit Your 2027 Leave Wishes</h2>
                    <p className="text-sm text-slate-600 mb-6">
                        Enter your name first, then provide your 1st, 2nd, and 3rd choices. Each choice must range from <strong>1 to 5 working days</strong> (Monday to Friday).
                    </p>

                    {message.text && (
                        <div className={`p-3 rounded mb-4 text-sm ${message.type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>
                            {message.text}
                        </div>
                    )}

                    <form onSubmit={handleSave} className="space-y-6">
                        <div className="p-4 border rounded-lg bg-slate-50 border-slate-200">
                            <label className="block text-sm font-bold text-slate-700 mb-1">Applicant Full Name</label>
                            <input 
                                type="text" 
                                required
                                className="w-full border rounded p-2 text-sm bg-white"
                                placeholder="e.g. John Doe"
                                value={name}
                                onChange={(e) => setName(e.target.value)}
                            />
                        </div>

                        {[
                            { label: '1st Priority Choice', state: first, setter: setFirst, bg: 'bg-indigo-50/30', border: 'border-indigo-100', titleColor: 'text-indigo-700' },
                            { label: '2nd Priority Choice', state: second, setter: setSecond, bg: 'bg-blue-50/30', border: 'border-blue-100', titleColor: 'text-blue-700' },
                            { label: '3rd Priority Choice', state: third, setter: setThird, bg: 'bg-teal-50/30', border: 'border-teal-100', titleColor: 'text-teal-700' }
                        ].map((choice, idx) => (
                            <div key={idx} className={`p-4 border rounded-lg ${choice.bg} ${choice.border}`}>
                                <h3 className={`font-semibold ${choice.titleColor} mb-2`}>{choice.label}</h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Start Date</label>
                                        <input 
                                            type="date" 
                                            min="2027-01-01" 
                                            max="2027-12-31" 
                                            className="w-full border rounded p-2 text-sm"
                                            value={choice.state.start}
                                            onChange={(e) => choice.setter({...choice.state, start: e.target.value})}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">End Date</label>
                                        <input 
                                            type="date" 
                                            min="2027-01-01" 
                                            max="2027-12-31" 
                                            className="w-full border rounded p-2 text-sm"
                                            value={choice.state.end}
                                            onChange={(e) => choice.setter({...choice.state, end: e.target.value})}
                                        />
                                    </div>
                                </div>
                                <p className="text-xs text-slate-500 mt-2">Working days selected: {countWorkingDays(choice.state.start, choice.state.end)}</p>
                            </div>
                        ))}

                        <button type="submit" className="w-full bg-indigo-600 text-white font-medium py-2 rounded-lg hover:bg-indigo-700 transition">
                            Save Leave Selection Choices
                        </button>
                    </form>
                </div>
            );
        }

        function AdminView({ applications, setApplications }) {
            const handleFinalApproval = (appId, choiceName) => {
                const updated = applications.map(app => {
                    if (app.id === appId) {
                        return { ...app, finalAssigned: app[choiceName] };
                    }
                    return app;
                });
                setApplications(updated);
            };

            const handleClearFinal = (appId) => {
                const updated = applications.map(app => {
                    if (app.id === appId) {
                        return { ...app, finalAssigned: null };
                    }
                    return app;
                });
                setApplications(updated);
            };

            return (
                <div className="bg-white p-6 rounded-xl shadow-sm border space-y-6">
                    <div>
                        <h2 className="text-xl font-bold text-slate-800 mb-1">Admin Dashboard - Manage Leave Results</h2>
                        <p className="text-sm text-slate-600">Review employee submissions and select final confirmed dates.</p>
                    </div>

                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr className="bg-slate-100 border-b text-slate-700">
                                    <th className="p-3">Applicant Name</th>
                                    <th className="p-3">1st Choice</th>
                                    <th className="p-3">2nd Choice</th>
                                    <th className="p-3">3rd Choice</th>
                                    <th className="p-3">Final Confirmed Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                {applications.length === 0 ? (
                                    <tr>
                                        <td colSpan="5" className="p-4 text-center text-slate-400 italic">No leave submissions recorded yet.</td>
                                    </tr>
                                ) : (
                                    applications.map(app => (
                                        <tr key={app.id} className="border-b hover:bg-slate-50">
                                            <td className="p-3 font-medium text-slate-800">{app.name}</td>
                                            <td className="p-3 text-xs">
                                                {app.first.start ? (
                                                    <div>
                                                        <span>{app.first.start} to {app.first.end}</span>
                                                        <br />
                                                        <button 
                                                            onClick={() => handleFinalApproval(app.id, 'first')}
                                                            className="mt-1 bg-indigo-100 text-indigo-700 hover:bg-indigo-600 hover:text-white px-2 py-0.5 rounded text-[10px] font-medium transition"
                                                        >
                                                            Set as Final
                                                        </button>
                                                    </div>
                                                ) : <span className="text-slate-400">None</span>}
                                            </td>
                                            <td className="p-3 text-xs">
                                                {app.second.start ? (
                                                    <div>
                                                        <span>{app.second.start} to {app.second.end}</span>
                                                        <br />
                                                        <button 
                                                            onClick={() => handleFinalApproval(app.id, 'second')}
                                                            className="mt-1 bg-blue-100 text-blue-700 hover:bg-blue-600 hover:text-white px-2 py-0.5 rounded text-[10px] font-medium transition"
                                                        >
                                                            Set as Final
                                                        </button>
                                                    </div>
                                                ) : <span className="text-slate-400">None</span>}
                                            </td>
                                            <td className="p-3 text-xs">
                                                {app.third.start ? (
                                                    <div>
                                                        <span>{app.third.start} to {app.third.end}</span>
                                                        <br />
                                                        <button 
                                                            onClick={() => handleFinalApproval(app.id, 'third')}
                                                            className="mt-1 bg-teal-100 text-teal-700 hover:bg-teal-600 hover:text-white px-2 py-0.5 rounded text-[10px] font-medium transition"
                                                        >
                                                            Set as Final
                                                        </button>
                                                    </div>
                                                ) : <span className="text-slate-400">None</span>}
                                            </td>
                                            <td className="p-3 text-xs">
                                                {app.finalAssigned && app.finalAssigned.start ? (
                                                    <div className="bg-emerald-50 border border-emerald-200 p-2 rounded">
                                                        <span className="font-semibold text-emerald-700 block">Confirmed:</span>
                                                        <span>{app.finalAssigned.start} to {app.finalAssigned.end}</span>
                                                        <br />
                                                        <button 
                                                            onClick={() => handleClearFinal(app.id)}
                                                            className="mt-1 text-red-600 hover:underline text-[10px]"
                                                        >
                                                            Clear
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <span className="text-amber-600 bg-amber-50 px-2 py-1 rounded border border-amber-200">Pending Selection</span>
                                                )}
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
